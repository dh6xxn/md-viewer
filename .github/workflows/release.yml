name: Build Desktop Releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis'
          - platform: macos-latest
            args: '--bundles app,dmg'
          - platform: ubuntu-22.04
            args: '--bundles appimage'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm install

      - name: Generate application icons
        run: npm run tauri icon src-tauri/icons/icon.svg

      - name: Verify generated application icons
        shell: bash
        run: |
          test -f src-tauri/icons/32x32.png
          test -f src-tauri/icons/64x64.png
          test -f src-tauri/icons/128x128.png
          test -f src-tauri/icons/128x128@2x.png
          test -f src-tauri/icons/icon.ico
          test -f src-tauri/icons/icon.icns

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Markdown Viewer ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
          releaseBody: Offline desktop Markdown viewer and editor.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
